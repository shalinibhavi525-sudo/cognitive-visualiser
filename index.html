<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steady OS | The Scholar's Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#121212] text-[#F5F2E7] transition-all duration-1000 font-['Inter']">

    <!-- LOGIN: THE REGISTRY -->
    <section id="view-login" class="flex items-center justify-center min-h-screen p-6 bg-[url('https://www.transparenttextures.com/patterns/dark-leather.png')]">
        <div class="auth-card p-12 max-w-md w-full border border-[#C5A059]/30 bg-[#1a1a1a] shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-[#C5A059]"></div>
            <h1 class="serif text-4xl mb-2 text-[#C5A059]">Steady OS</h1>
            <p class="text-xs uppercase tracking-[0.2em] mb-10 opacity-60">The Scholar's Cognitive Bridge</p>
            
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] uppercase tracking-widest block mb-2 opacity-50">Identifier</label>
                    <input type="email" id="userEmail" placeholder="email@university.edu" class="auth-input">
                </div>
                <button onclick="handleLogin()" class="btn-elegant w-full">Open Ledger</button>
            </div>
        </div>
    </section>

    <!-- ONBOARDING: THE COGNITIVE PRINT -->
    <section id="view-onboarding" class="hidden min-h-screen p-12">
        <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
            <div>
                <h2 class="serif text-5xl mb-6 italic">The Spiky Profile</h2>
                <p class="opacity-60 mb-12 text-lg leading-relaxed">Tune the architecture of your workspace. No labels, just the geometry of your mind.</p>
                <div id="slider-root" class="space-y-10"></div>
                <button onclick="saveAndGo()" class="mt-16 btn-elegant px-12">Finalize Environment</button>
            </div>
            <div class="p-10 border border-[#C5A059]/20 bg-[#161616] shadow-inner relative">
                <canvas id="brainChart"></canvas>
            </div>
        </div>
    </section>

    <!-- DASHBOARD: THE STUDY -->
    <section id="view-dashboard" class="hidden min-h-screen p-8 lg:p-16">
        <header class="max-w-7xl mx-auto flex justify-between items-end mb-20 border-b border-[#C5A059]/20 pb-8">
            <div>
                <h1 class="serif text-4xl mb-2">The Private Study</h1>
                <div class="flex items-center gap-4">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-[#C5A059] shadow-[0_0_8px_#C5A059]"></span>
                    <p id="system-status" class="text-[10px] uppercase tracking-[0.2em] opacity-50">Focus Level: Nominal</p>
                </div>
            </div>
            
            <div class="flex items-center gap-10">
                <div class="text-right">
                    <p class="text-[10px] uppercase tracking-widest opacity-40 mb-2">Energy Reserves</p>
                    <div class="flex items-center gap-4">
                        <div class="w-48 h-[2px] bg-white/10 overflow-hidden">
                            <div id="spoon-bar" class="bg-[#C5A059] h-full transition-all duration-700"></div>
                        </div>
                        <span id="spoon-count" class="serif text-xl italic text-[#C5A059]">10</span>
                    </div>
                </div>
                <button onclick="logout()" class="opacity-40 hover:opacity-100 transition"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3-3l-3-3m3 3l-3 3m3-3H9" /></svg></button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-16">
            <!-- TASKS: THE LEDGER -->
            <div class="lg:col-span-7">
                <div class="flex gap-4 mb-12">
                    <input type="text" id="taskInput" placeholder="Enter objective..." class="ledger-input">
                    <button onclick="addTask()" class="btn-elegant whitespace-nowrap px-8">Commit</button>
                </div>
                <div id="taskList" class="space-y-6"></div>
            </div>

            <!-- TOOLS: THE COMPASS -->
            <div class="lg:col-span-5 space-y-12">
                <div class="tool-card p-8 border border-[#C5A059]/10 bg-[#161616]">
                    <h3 class="serif text-xl mb-4 italic text-[#C5A059]">Instruction Decoder</h3>
                    <textarea id="decoderInput" class="ledger-input h-32 text-sm mb-4" placeholder="Paste chaotic instructions..."></textarea>
                    <button onclick="decode()" class="w-full py-3 text-[10px] uppercase tracking-widest border border-[#C5A059]/30 hover:bg-[#C5A059]/10 transition">Extract Logic</button>
                    <div id="decoderOutput" class="hidden mt-6 p-4 bg-[#C5A059]/5 border-l-2 border-[#C5A059] italic text-sm text-[#C5A059]/80"></div>
                </div>

                <div class="p-6 border border-[#C5A059]/5 bg-[#161616]/50">
                    <canvas id="miniChart" height="220"></canvas>
                </div>
            </div>
        </main>
    </section>

    <script src="script.js"></script>
</body>
</html>
