<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAF | Cognitive Architecture Framework</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --parchment: #fdfcf0; 
            --ink: #1a1a1a;       
            --gold: #b8860b;      
            --border: #d1cfb7;    
            --text-secondary: #555;
            --shame-free: #f4f1de; /* Warm, safe color for triage */
        }

        body {
            background-color: var(--parchment);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 40px 0 20px 0;
            text-align: center;
            border-bottom: 1px double var(--border);
            margin-bottom: 30px;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-style: italic; margin: 0; }
        .tagline { font-family: 'Playfair Display', serif; color: var(--text-secondary); font-style: italic; }

        .app-container {
            max-width: 1100px;
            width: 95%;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
            margin-bottom: 100px;
        }

        .panel { padding: 10px; }

        .control-section { margin-bottom: 30px; }
        .control-section h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--gold); border-bottom: 1px solid var(--border); margin-bottom: 15px; }

        .slider-wrap { margin-bottom: 15px; }
        .slider-wrap label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; }
        
        input[type=range] { width: 100%; accent-color: var(--gold); cursor: pointer; }

        /* Triage / Feedback Loop Section */
        .triage-container {
            margin-top: 30px;
            background: var(--shame-free);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 4px;
        }

        .triage-btn {
            background: var(--ink);
            color: var(--parchment);
            border: none;
            padding: 10px 15px;
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }

        /* Manifesto Styling */
        .manifesto-box {
            border: 1px solid var(--border);
            padding: 30px;
            background: white;
            box-shadow: 8px 8px 0px var(--border);
        }

        .manifesto-box h2 { font-family: 'Playfair Display', serif; border-bottom: 2px solid var(--gold); display: inline-block; margin-bottom: 15px; }
        #supportText { line-height: 1.7; font-size: 0.9rem; }

        @media (max-width: 850px) { .app-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <h1>The Cognitive Architecture Framework</h1>
    <div class="tagline">v1.2: Feedback-Driven Observability Layer</div>
</header>

<div class="app-container">
    <!-- INPUT PANEL -->
    <div class="panel">
        <div class="control-section">
            <h3>Intellectual Strengths</h3>
            <div class="slider-wrap"><label>Synthesizing Complex Data</label><input type="range" min="1" max="10" value="9" id="p1"></div>
            <div class="slider-wrap"><label>Rapid Pattern Recognition</label><input type="range" min="1" max="10" value="8" id="p2"></div>
        </div>

        <div class="control-section">
            <h3>Observed Behaviors</h3>
            <div class="slider-wrap"><label>Rescheduling Frequency</label><input type="range" min="1" max="10" value="7" id="v1"></div>
            <div class="slider-wrap"><label>Task Avoidance (Shame)</label><input type="range" min="1" max="10" value="6" id="v2"></div>
            <div class="slider-wrap"><label>Sensory Sensitivity</label><input type="range" min="1" max="10" value="4" id="v3"></div>
        </div>

        <div class="triage-container">
            <h3 style="font-family: 'Playfair Display'; margin-top: 0; font-size: 1rem;">Triage Protocol</h3>
            <p style="font-size: 0.75rem; color: #666;">If you hit the 'Wall of Awful', initiate a shame-free observation loop.</p>
            <button class="triage-btn" onclick="triggerTriage()">INITIATE OBSERVABILITY LOOP</button>
            <div id="triageOutput" style="font-size: 0.85rem; font-style: italic; color: var(--gold); border-top: 1px solid #ddd; padding-top: 10px;"></div>
        </div>
    </div>

    <!-- VISUAL PANEL -->
    <div class="panel">
        <div style="height: 400px; margin-bottom: 40px;">
            <canvas id="mainChart"></canvas>
        </div>

        <div class="manifesto-box">
            <h2>Adaptive Support Protocol</h2>
            <div id="supportText">Analyzing architectural data points...</div>
        </div>
    </div>
</div>

<script>
    const ctx = document.getElementById('mainChart').getContext('2d');
    const labels = ['Synthesis', 'Patterns', 'Rescheduling', 'Avoidance', 'Sensory', 'Focus'];
    const initialData = [9, 8, 7, 6, 4, 8];

    let chart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: labels,
            datasets: [{
                data: initialData,
                backgroundColor: 'rgba(184, 134, 11, 0.1)',
                borderColor: '#1a1a1a',
                pointBackgroundColor: '#b8860b',
                borderWidth: 1.5
            }]
        },
        options: {
            scales: {
                r: { min: 0, max: 10, grid: { color: '#d1cfb7' }, angleLines: { color: '#d1cfb7' }, 
                     pointLabels: { font: { family: "'Playfair Display'", size: 13 } }, ticks: { display: false } }
            },
            plugins: { legend: { display: false } }
        }
    });

    function triggerTriage() {
        const output = document.getElementById('triageOutput');
        const avoidance = chart.data.datasets[0].data[3];
        
        if (avoidance > 5) {
            output.innerHTML = "<b>Observation:</b> You have rescheduled this task 3 times. <i>Is it still important to you?</i> Should we snooze it for 2 weeks, or delete it to remove the shame-load?";
        } else {
            output.innerHTML = "System standing by. No shame-load detected.";
        }
    }

    function generateManifesto() {
        const vals = chart.data.datasets[0].data;
        const text = document.getElementById('supportText');
        
        let protocol = "<b>Label-Less Adaptation Strategy:</b><br><br>";

        if(vals[2] > 6) protocol += "• <b>Observability Loop:</b> Detected high rescheduling patterns. Recommending 'Behavioral Triage'—the system will actively question task relevance before showing a 'Red/Overdue' alert to prevent shame-avoidance.<br>";
        
        if(vals[3] > 6) protocol += "• <b>The Wall of Awful:</b> High avoidance detected. Shifting interface to 'Compassion Mode'—replacing deadlines with 'Interests Windows'.<br>";

        if(vals[0] > 7) protocol += "• <b>Synthesis Hook:</b> For high-complexity tasks, skip the 'Step-by-Step' list. Provide a 'Deep Dive' overview first to engage pattern recognition.<br>";

        text.innerHTML = protocol;
    }

    const inputs = ['p1', 'p2', 'v1', 'v2', 'v3'];
    inputs.forEach((id, index) => {
        document.getElementById(id).addEventListener('input', (e) => {
            chart.data.datasets[0].data[index] = e.target.value;
            chart.update();
            generateManifesto();
        });
    });

    generateManifesto();
</script>

</body>
</html>
