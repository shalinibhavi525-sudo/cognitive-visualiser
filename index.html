<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steady OS | MIT Behavioral Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0c0c0c] text-[#F5F2E7] font-['Inter'] transition-all duration-1000">

    <!-- CAMERA OVERLAY -->
    <div id="camera-modal" class="hidden fixed inset-0 z-[100] bg-black/95 flex flex-col items-center justify-center p-6 backdrop-blur-xl">
        <video id="webcam" autoplay playsinline class="w-full max-w-lg grayscale border border-[#C5A059]/30 shadow-2xl"></video>
        <div class="mt-8 flex gap-6">
            <button onclick="captureSnapshot()" class="btn-elegant px-10">Capture Instruction</button>
            <button onclick="closeCamera()" class="text-[9px] uppercase tracking-widest opacity-50">Cancel</button>
        </div>
        <canvas id="capture-canvas" class="hidden"></canvas>
    </div>

    <!-- VIEW: LOGIN (Mock Google Auth) -->
    <section id="view-login" class="flex items-center justify-center min-h-screen p-6">
        <div class="auth-card p-12 max-w-md w-full border border-[#C5A059]/30 text-center shadow-2xl bg-[#161616]">
            <h1 class="serif text-5xl mb-2 text-[#C5A059] italic">Steady OS</h1>
            <p class="text-[9px] uppercase tracking-[0.4em] mb-12 opacity-40">University Cognitive Registry</p>
            <button onclick="handleLogin()" class="w-full flex items-center justify-center gap-4 bg-white text-black py-4 rounded-sm font-bold text-xs uppercase tracking-widest hover:bg-[#F5F2E7] transition">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5"> Sign in with Google
            </button>
        </div>
    </section>

    <!-- VIEW: ONBOARDING (Neural Map) -->
    <section id="view-onboarding" class="hidden min-h-screen p-12 lg:p-24 bg-[#0e0e0e]">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
            <div>
                <h2 class="serif text-6xl mb-8 italic text-[#C5A059]">The Neural Map.</h2>
                <div id="onboarding-sliders" class="space-y-10"></div>
                <div class="mt-16 flex flex-wrap gap-6">
                    <button onclick="saveAndGo()" class="btn-elegant px-12">Initialize Study</button>
                    <button onclick="downloadPassport()" class="text-[9px] uppercase tracking-widest border border-[#C5A059]/20 px-8 py-4 hover:bg-[#C5A059]/10 transition">Download Passport (PDF)</button>
                </div>
            </div>
            <div class="flex flex-col gap-10 items-center">
                <div class="p-10 border border-[#C5A059]/10 bg-[#121212] rounded-full aspect-square w-full max-w-md shadow-inner">
                    <canvas id="onboardingChart"></canvas>
                </div>
                <div id="onboarding-desc" class="p-8 border border-[#C5A059]/5 bg-[#161616] italic text-sm text-[#C5A059]/70 leading-relaxed text-center">
                    The Lexicon is analyzing your spiky profile...
                </div>
            </div>
        </div>
    </section>

    <!-- VIEW: DASHBOARD (The Study) -->
    <section id="view-dashboard" class="hidden min-h-screen p-8 lg:p-12">
        <header class="max-w-7xl mx-auto flex justify-between items-end mb-16 border-b border-[#C5A059]/10 pb-8">
            <h1 class="serif text-5xl italic opacity-90">The Private Study</h1>
            <div class="flex gap-8 items-center">
                <input type="password" id="apiKeyInput" placeholder="Paste Gemini Key Here" class="text-[10px] bg-white/5 p-2 rounded border border-white/10 outline-none focus:border-[#C5A059] w-48 text-white">
                <button onclick="logout()" class="text-[9px] opacity-20 hover:opacity-100 uppercase tracking-widest">Logout</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12">
            <!-- SIDEBAR: LIVE RECONFIGURATION -->
            <div class="lg:col-span-3 space-y-10 border-r border-[#C5A059]/10 pr-8">
                <div class="p-6 border border-[#C5A059]/10 bg-[#121212]/50 shadow-inner">
                    <canvas id="dashboardChart"></canvas>
                </div>
                <div id="dashboard-sliders" class="space-y-8"></div>
                <div class="text-right pt-6 border-t border-white/5">
                    <p class="text-[9px] opacity-30 uppercase tracking-widest mb-3">Cognitive Budget (Spoons)</p>
                    <div class="flex items-center gap-3">
                        <div class="w-full h-[1px] bg-white/5"><div id="spoon-bar" class="bg-[#C5A059] h-full transition-all duration-1000"></div></div>
                        <span id="spoon-count" class="serif text-2xl italic text-[#C5A059]">10</span>
                    </div>
                </div>
            </div>

            <!-- MAIN: THE SMART LEDGER -->
            <div class="lg:col-span-6 space-y-12">
                <div class="flex flex-col gap-6 p-8 border border-[#C5A059]/5 bg-[#141414]/50">
                    <input type="text" id="taskInput" placeholder="Identify an objective..." class="ledger-input italic text-3xl">
                    <div class="flex gap-4 items-center">
                        <input type="number" id="timeInput" placeholder="Time" class="ledger-input w-24 text-center">
                        <select id="timeUnit" class="bg-transparent border-b border-[#C5A059]/20 text-[10px] uppercase tracking-widest outline-none h-12 cursor-pointer">
                            <option value="mins" class="bg-black">Minutes</option>
                            <option value="hours" class="bg-black">Hours</option>
                            <option value="days" class="bg-black">Days</option>
                        </select>
                        <button onclick="addTask()" class="btn-elegant px-10 ml-auto">Commit to Ledger</button>
                    </div>
                </div>
                <div id="taskList" class="space-y-12"></div>
            </div>

            <!-- RIGHT: THE LEXICON -->
            <div class="lg:col-span-3">
                <div class="tool-card p-10 border border-[#C5A059]/5 bg-[#141414]">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="serif text-2xl italic text-[#C5A059]">The Lexicon</h3>
                        <button onclick="openCamera()" class="p-2 border border-[#C5A059]/20 rounded-full hover:bg-[#C5A059]/10 transition">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" /></svg>
                        </button>
                    </div>
                    <textarea id="decoderInput" class="ledger-input h-32 text-xs mb-6 border-none bg-white/5 p-4" placeholder="Paste chaotic correspondence..."></textarea>
                    <button onclick="decode()" class="w-full btn-elegant">Translate Flux</button>
                    <div id="decoderOutput" class="hidden mt-8 p-6 bg-[#C5A059]/5 border-l border-[#C5A059]/30 italic text-sm text-[#C5A059]/90"></div>
                </div>
            </div>
        </main>
    </section>

    <script src="script.js"></script>
</body>
</html>
