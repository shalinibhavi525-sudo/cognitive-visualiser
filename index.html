<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAF | The Gentle Triage</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --parchment: #fdfcf0; 
            --ink: #1a1a1a;       
            --gold: #b8860b;      
            --border: #d1cfb7;    
            --text-secondary: #555;
        }

        body {
            background-color: var(--parchment);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 40px 0 20px 0;
            text-align: center;
            border-bottom: 1px double var(--border);
            margin-bottom: 30px;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-style: italic; margin: 0; }
        .tagline { font-family: 'Playfair Display', serif; color: var(--text-secondary); font-style: italic; }

        .app-container {
            max-width: 1100px;
            width: 95%;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 40px;
            margin-bottom: 50px;
        }

        .panel { padding: 20px; border: 1px solid var(--border); background: white; box-shadow: 5px 5px 0px var(--border); }

        .control-section h3 { font-family: 'Playfair Display', serif; color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-bottom: 15px; }

        .slider-wrap { margin-bottom: 15px; }
        .slider-wrap label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
        input[type=range] { width: 100%; accent-color: var(--gold); cursor: pointer; }

        /* Task Section */
        .task-area {
            grid-column: span 2;
            background: white;
            border: 1px solid var(--border);
            padding: 30px;
            box-shadow: 8px 8px 0px var(--border);
            margin-bottom: 100px;
        }

        .task-input-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type=text] { flex: 1; padding: 10px; border: 1px solid var(--border); font-family: 'Inter'; }
        
        .btn { 
            background: var(--ink); color: var(--parchment); border: none; padding: 10px 20px; 
            font-family: 'Playfair Display'; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: var(--gold); }

        .task-card {
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .triage-alert {
            background: #fff9e6;
            border: 1px solid var(--gold);
            padding: 15px;
            margin-top: 10px;
            font-style: italic;
            font-size: 0.9rem;
        }

        @media (max-width: 850px) { .app-container { grid-template-columns: 1fr; } .task-area { grid-column: span 1; } }
    </style>
</head>
<body>

<header>
    <h1>The Gentle Architecture</h1>
    <div class="tagline">v1.3: Understanding the "Wall of Awful" through Data</div>
</header>

<div class="app-container">
    <!-- LEFT: THE RATINGS -->
    <div class="panel">
        <div class="control-section">
            <h3>My Strengths</h3>
            <div class="slider-wrap">
                <label>Seeing Connections</label>
                <input type="range" min="1" max="10" value="9" id="s1">
            </div>
            <div class="slider-wrap">
                <label>Deep Focus Power</label>
                <input type="range" min="1" max="10" value="8" id="s2">
            </div>
        </div>

        <div class="control-section">
            <h3>My Friction</h3>
            <div class="slider-wrap">
                <label>Starting the Work</label>
                <input type="range" min="1" max="10" value="3" id="f1">
            </div>
            <div class="slider-wrap">
                <label>Switching Gears</label>
                <input type="range" min="1" max="10" value="4" id="f2">
            </div>
            <div class="slider-wrap">
                <label>Background Noise</label>
                <input type="range" min="1" max="10" value="4" id="f3">
            </div>
        </div>
    </div>

    <!-- RIGHT: THE RADAR -->
    <div class="panel">
        <canvas id="radarChart" style="max-height: 400px;"></canvas>
    </div>

    <!-- BOTTOM: TASKS & MANEUVERS -->
    <div class="task-area">
        <h2 style="font-family: 'Playfair Display'; border-bottom: 2px solid var(--gold); display: inline-block;">Tasks & Maneuvers</h2>
        <p style="font-size: 0.9rem; color: #666;">Add your tasks. If you keep snoozing them, we'll talk about it—no judgment.</p>
        
        <div class="task-input-row">
            <input type="text" id="taskInput" placeholder="What's on your mind?">
            <button class="btn" onclick="addTask()">Add Task</button>
        </div>

        <div id="taskList"></div>
    </div>
</div>

<script>
    // --- Chart Logic ---
    const ctx = document.getElementById('radarChart').getContext('2d');
    const labels = ['Connections', 'Focus', 'Starting', 'Switching', 'Noise', 'Energy'];
    const initialData = [9, 8, 3, 4, 4, 7];

    let chart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: labels,
            datasets: [{
                data: initialData,
                backgroundColor: 'rgba(184, 134, 11, 0.1)',
                borderColor: '#1a1a1a',
                pointBackgroundColor: '#b8860b',
                borderWidth: 1.5
            }]
        },
        options: {
            scales: {
                r: { min: 0, max: 10, ticks: { display: false }, grid: { color: '#d1cfb7' }, 
                     pointLabels: { font: { family: "'Playfair Display'", size: 14 } } }
            },
            plugins: { legend: { display: false } }
        }
    });

    // Update chart on slider change
    const sliders = ['s1', 's2', 'f1', 'f2', 'f3'];
    sliders.forEach((id, i) => {
        document.getElementById(id).oninput = (e) => {
            chart.data.datasets[0].data[i] = e.target.value;
            chart.update();
        }
    });

    // --- Task & Triage Logic ---
    let tasks = [];

    function addTask() {
        const input = document.getElementById('taskInput');
        if (!input.value) return;
        
        const newTask = {
            id: Date.now(),
            text: input.value,
            snoozes: 0,
            addedOn: new Date().toLocaleDateString()
        };
        
        tasks.push(newTask);
        input.value = "";
        renderTasks();
    }

    function snoozeTask(id) {
        const task = tasks.find(t => t.id === id);
        task.snoozes++;
        renderTasks();
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = "";

        tasks.forEach(task => {
            const card = document.createElement('div');
            card.className = "task-card";
            
            // Triage Logic: If snoozed more than 2 times
            let triageMsg = "";
            if (task.snoozes >= 3) {
                triageMsg = `
                    <div class="triage-alert">
                        <b>Gentle Check-in:</b> You've snoozed this ${task.snoozes} times. 
                        Activity Rate: Low. <br>
                        "Hey, is this still important to you? Should we delete it or hide it for a week?"
                        <br>
                        <button class="btn" style="padding: 5px 10px; margin-top: 10px; font-size: 0.7rem;" onclick="deleteTask(${task.id})">Delete (Let it go)</button>
                    </div>
                `;
            }

            card.innerHTML = `
                <div style="flex: 1;">
                    <span style="font-weight: 600;">${task.text}</span> <br>
                    <small style="color: #888;">Added: ${task.addedOn} | Snoozed: ${task.snoozes} times</small>
                    ${triageMsg}
                </div>
                <div>
                    <button class="btn" style="background: transparent; color: var(--gold); border: 1px solid var(--gold);" onclick="snoozeTask(${task.id})">Snooze</button>
                    <button class="btn" style="background: transparent; color: #888;" onclick="deleteTask(${task.id})">Done</button>
                </div>
            `;
            list.appendChild(card);
        });
    }
</script>
</body>  
</html>
