<!-- DASHBOARD -->
<section id="view-dashboard" class="hidden min-h-screen p-6 lg:p-12">
    <header class="max-w-7xl mx-auto flex justify-between items-end mb-12 border-b border-[#C5A059]/10 pb-8">
        <div>
            <h1 class="serif text-5xl italic opacity-90">The Private Study</h1>
            <p id="system-status" class="text-[9px] uppercase tracking-[0.3em] opacity-40 mt-2">Observing Neural Flux...</p>
        </div>
        <div class="flex gap-8 items-center">
            <input type="password" id="apiKeyInput" placeholder="Paste OpenAI Key Here" class="text-[10px] bg-white/5 p-2 rounded border border-white/10 outline-none focus:border-[#C5A059]">
            <button onclick="logout()" class="opacity-20 hover:opacity-100 transition">LOGOUT</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12">
        <!-- LEFT: TUNING SIDEBAR (NEW) -->
        <div class="lg:col-span-3 space-y-10 border-r border-[#C5A059]/10 pr-8">
            <div class="p-4 border border-[#C5A059]/10 bg-[#121212]/50">
                <p class="text-[9px] uppercase tracking-[0.4em] text-center mb-6 opacity-40 font-bold">Live Cognitive Map</p>
                <canvas id="miniChart"></canvas>
            </div>
            <div id="dashboard-sliders" class="space-y-6">
                <!-- Sliders will be injected here for live tuning -->
            </div>
            <div id="live-desc" class="text-[11px] italic opacity-40 leading-relaxed border-t border-white/5 pt-4">
                Adjust sliders to reconfigure the environment...
            </div>
        </div>

        <!-- CENTER: LEDGER -->
        <div class="lg:col-span-6 space-y-10">
            <div class="flex flex-col gap-4">
                <input type="text" id="taskInput" placeholder="New Objective..." class="ledger-input italic text-3xl">
                <div class="flex gap-2">
                    <input type="number" id="timeInput" placeholder="Duration" class="ledger-input w-full">
                    <select id="timeUnit" class="bg-transparent border-b border-[#C5A059]/20 text-[10px] uppercase tracking-widest outline-none">
                        <option value="mins" class="bg-black">Mins</option>
                        <option value="hours" class="bg-black">Hours</option>
                        <option value="days" class="bg-black">Days</option>
                    </select>
                    <button onclick="addTask()" class="btn-elegant px-10">Commit</button>
                </div>
            </div>
            <div id="taskList" class="space-y-10"></div>
        </div>

        <!-- RIGHT: LEXICON -->
        <div class="lg:col-span-3">
            <div class="tool-card p-8 border border-[#C5A059]/5 bg-[#141414]">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="serif text-xl italic text-[#C5A059]">The Lexicon</h3>
                    <button onclick="openCamera()" class="p-2 border border-[#C5A059]/20 rounded-full hover:bg-[#C5A059]/10">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" /></svg>
                    </button>
                </div>
                <textarea id="decoderInput" class="ledger-input h-24 text-xs mb-6 border-none bg-white/5 p-2" placeholder="Paste chaos..."></textarea>
                <button onclick="decode()" class="w-full btn-elegant py-3 text-[9px]">Decipher</button>
                <div id="decoderOutput" class="hidden mt-6 p-4 bg-[#C5A059]/5 border-l border-[#C5A059]/30 italic text-xs text-[#C5A059]/80"></div>
            </div>
        </div>
    </main>
</section>
