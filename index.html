<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steady OS | The Scholar's Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0c0c0c] text-[#F5F2E7] font-['Inter']">

    <!-- CAMERA OVERLAY -->
    <div id="camera-modal" class="hidden fixed inset-0 z-[100] bg-black/95 flex flex-col items-center justify-center p-6 backdrop-blur-xl">
        <video id="webcam" autoplay playsinline class="w-full max-w-lg grayscale border border-[#C5A059]/30 rounded-lg"></video>
        <div class="mt-8 flex gap-6">
            <button onclick="captureSnapshot()" class="btn-elegant px-10">Capture Instruction</button>
            <button onclick="closeCamera()" class="text-[9px] uppercase tracking-widest opacity-50">Cancel</button>
        </div>
        <canvas id="capture-canvas" class="hidden"></canvas>
    </div>

    <!-- REGISTRY (LOGIN) -->
    <section id="view-login" class="flex items-center justify-center min-h-screen p-6">
        <div class="auth-card p-12 max-w-md w-full border border-[#C5A059]/30 bg-[#161616] text-center shadow-2xl">
            <h1 class="serif text-5xl mb-2 text-[#C5A059] italic">Steady OS</h1>
            <p class="text-[9px] uppercase tracking-[0.4em] mb-12 opacity-40 italic">University Registry</p>
            
            <!-- Mock Google Sign In -->
            <button onclick="handleLogin()" class="w-full flex items-center justify-center gap-4 bg-white text-black py-4 rounded-sm font-bold text-xs uppercase tracking-widest hover:bg-[#F5F2E7] transition mb-6">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5"> Sign in with Google
            </button>
            <p class="text-[9px] opacity-30">The ledger will remember your identity across sessions.</p>
        </div>
    </section>

    <!-- ONBOARDING (BRAIN PRINT) -->
    <section id="view-onboarding" class="hidden min-h-screen p-12 lg:p-20 bg-[#0e0e0e]">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-20">
            <div class="reveal">
                <h2 class="serif text-6xl mb-8 italic text-[#C5A059]">The Neural Map.</h2>
                <div id="slider-root" class="space-y-10">
                    <!-- Sliders Injected Here -->
                </div>
                <div class="mt-16 flex flex-wrap gap-6">
                    <button onclick="saveAndGo()" class="btn-elegant px-12">Initialize Study</button>
                    <button onclick="downloadPassport()" class="text-[9px] uppercase tracking-widest border border-[#C5A059]/20 px-8 py-4 hover:bg-[#C5A059]/10 transition">Export Passport (PDF)</button>
                </div>
            </div>
            
            <div class="flex flex-col gap-10">
                <div class="p-10 border border-[#C5A059]/10 bg-[#121212] shadow-2xl rounded-full aspect-square">
                    <canvas id="brainChart"></canvas>
                </div>
                <!-- AI Generated Description -->
                <div id="profile-desc" class="p-8 border border-[#C5A059]/5 bg-[#161616] italic text-sm text-[#C5A059]/70 leading-relaxed">
                    Adjust the map to generate your behavioral manual...
                </div>
            </div>
        </div>
    </section>

    <!-- DASHBOARD -->
    <section id="view-dashboard" class="hidden min-h-screen p-8 lg:p-16">
        <header class="max-w-7xl mx-auto flex justify-between items-end mb-20 border-b border-[#C5A059]/10 pb-10">
            <h1 class="serif text-5xl italic opacity-90">The Private Study</h1>
            <div class="flex gap-10 items-end">
                <div class="text-right">
                    <p class="text-[9px] uppercase tracking-widest opacity-30 mb-2">Energy (Spoons)</p>
                    <div class="flex items-center gap-4">
                        <div class="w-32 h-[1px] bg-white/5"><div id="spoon-bar" class="bg-[#C5A059] h-full transition-all duration-1000"></div></div>
                        <span id="spoon-count" class="serif text-2xl italic text-[#C5A059]">10</span>
                    </div>
                </div>
                <button onclick="logout()" class="opacity-20 hover:opacity-100 transition"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-16">
            <!-- LEDGER -->
            <div class="lg:col-span-7">
                <div class="flex flex-col md:flex-row gap-4 mb-12">
                    <input type="text" id="taskInput" placeholder="Objective..." class="ledger-input italic text-2xl flex-1">
                    <input type="number" id="timeInput" placeholder="Mins" class="ledger-input w-24 text-center">
                    <button onclick="addTask()" class="btn-elegant px-8">Commit</button>
                </div>
                <div id="taskList" class="space-y-12"></div>
            </div>

            <!-- LEXICON -->
            <div class="lg:col-span-5 space-y-12">
                <div class="tool-card p-10 border border-[#C5A059]/5 bg-[#141414]">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="serif text-2xl italic text-[#C5A059]">The Lexicon</h3>
                        <button onclick="openCamera()" class="p-2 border border-[#C5A059]/20 rounded-full hover:bg-[#C5A059]/10"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" /></svg></button>
                    </div>
                    <textarea id="decoderInput" class="ledger-input h-32 text-sm mb-6 bg-white/5 p-4 border-none" placeholder="Paste chaos..."></textarea>
                    <button onclick="decode()" class="w-full btn-elegant">Extract Essence</button>
                    <div id="decoderOutput" class="hidden mt-8 p-6 bg-[#C5A059]/5 border-l border-[#C5A059]/30 italic text-sm text-[#C5A059]/90"></div>
                </div>
            </div>
        </main>
    </section>

    <script src="script.js"></script>
</body>
</html>
