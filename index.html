<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Scholar's Control Plane | CAF v8.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0d0d0d;
            --vellum: #f4f1e1;
            --ink: #1a1a1a;
            --oxblood: #660708;
            --gold: #9a8c73;
            --moss: #2b2d24;
            --slate: #4a4e69;
            --warning: #ff4d4d;
        }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: 'EB Garamond', serif;
            margin: 0; padding: 20px;
            display: flex; justify-content: center;
            transition: filter 1s ease, opacity 1s ease;
        }

        .master-grid {
            max-width: 1400px;
            width: 100%;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
        }

        header {
            grid-column: span 2;
            background: var(--vellum);
            border: 2px solid var(--gold);
            padding: 30px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { font-family: 'Playfair Display'; font-size: 2.8rem; margin: 0; color: var(--oxblood); }

        .panel {
            background: var(--vellum);
            border: 1px solid var(--gold);
            padding: 25px;
            box-shadow: 10px 10px 40px rgba(0,0,0,0.3);
            position: relative;
        }

        /* Focus Firewall State */
        .firewall-active .hide-on-focus { display: none !important; }
        .firewall-active .master-grid { grid-template-columns: 1fr; }

        h2 { font-family: 'Playfair Display'; border-bottom: 1px solid var(--oxblood); color: var(--oxblood); padding-bottom: 5px; font-size: 1.2rem; }

        /* The Instrumentation Monitor */
        .monitor {
            background: #000; color: #00ffaa;
            padding: 15px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
            border-radius: 4px; border: 1px solid var(--gold);
            line-height: 1.5;
        }

        .slider-group { margin-bottom: 15px; }
        label { display: block; font-family: 'JetBrains Mono'; font-size: 0.65rem; text-transform: uppercase; color: var(--slate); margin-bottom: 4px; }
        input[type=range] { width: 100%; accent-color: var(--oxblood); cursor: pointer; }

        /* Task & Action */
        .task-input { display: grid; grid-template-columns: 1fr 100px; gap: 10px; margin-bottom: 20px; }
        input[type=text], select { padding: 10px; background: white; border: 1px solid var(--gold); font-family: 'EB Garamond'; font-size: 1rem; }

        .btn {
            background: var(--oxblood); color: white; border: none; padding: 12px;
            font-family: 'Playfair Display'; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: #a4161a; }
        .btn-gold { background: var(--gold); color: black; }

        .task-item {
            border-bottom: 1px dashed var(--gold); padding: 15px 0;
            display: flex; justify-content: space-between; align-items: center;
        }

        .archetype-badge {
            background: var(--moss); color: var(--vellum);
            padding: 5px 10px; font-family: 'Playfair Display'; font-style: italic; font-size: 0.9rem;
            display: inline-block; margin-top: 10px;
        }

        /* Thermal Throttling Effect */
        .throttled { filter: grayscale(0.8) brightness(0.5); pointer-events: none; }
    </style>
</head>
<body id="bodyRoot">

<div class="master-grid">
    <header>
        <h1>The Scholar's Control Plane</h1>
        <div style="font-family: 'Playfair Display'; font-style: italic;">Cognitive Architecture & Thermal Throttling Layer | v8.0</div>
    </header>

    <!-- LEFT: SYSTEMS INSTRUMENTATION -->
    <div class="panel hide-on-focus">
        <h2>System Monitoring</h2>
        <div class="monitor" id="sysMon">
            CORE_TEMP: 32°C (STABLE)<br>
            LOAD: 0%<br>
            ARCHETYPE: INITIALIZING...
        </div>
        <div class="archetype-badge" id="archBadge">Determining Persona...</div>

        <h2 style="margin-top: 30px;">Input Bias</h2>
        <div class="slider-group">
            <label>Environmental Noise (mB)</label>
            <input type="range" id="noise" min="1" max="10" value="2">
        </div>
        <div class="slider-group">
            <label>Physical Fatigue</label>
            <input type="range" id="fatigue" min="1" max="10" value="1">
        </div>

        <h2>Cognitive Architecture</h2>
        <div class="slider-group"><label>Synthesis Velocity</label><input type="range" class="cv" min="1" max="10" value="9"></div>
        <div class="slider-group"><label>Focus Depth</label><input type="range" class="cv" min="1" max="10" value="8"></div>
        <div class="slider-group"><label>Executive Power</label><input type="range" class="cv" min="1" max="10" value="4"></div>
        <div class="slider-group"><label>Sensory Integration</label><input type="range" class="cv" min="1" max="10" value="5"></div>
    </div>

    <!-- RIGHT: VISUALIZATION & ACTION -->
    <div class="panel" style="display: flex; flex-direction: column; align-items: center;">
        <div class="hide-on-focus" style="width: 100%; height: 350px;">
            <canvas id="radarMap"></canvas>
        </div>

        <div style="width: 100%; margin-top: 40px;">
            <h2>Action Ledger</h2>
            <div class="task-input hide-on-focus">
                <input type="text" id="tName" placeholder="Maneuver description...">
                <select id="tEnergy">
                    <option value="5">5 Spoons</option>
                    <option value="15">15 Spoons</option>
                    <option value="30">30 Spoons</option>
                </select>
                <button class="btn" style="grid-column: span 2;" onclick="addTask()">RECORD MANEUVER</button>
            </div>

            <div id="ledgerItems"></div>
        </div>

        <div class="hide-on-focus" style="margin-top: 40px; text-align: center;">
            <button class="btn btn-gold" onclick="window.print()">PUBLISH MANUSCRIPT (PDF)</button>
            <button class="btn btn-gold" style="margin-left: 10px;" onclick="exportSettings()">HARDEN IDE (.JSON)</button>
        </div>
    </div>
</div>

<script>
    const ctx = document.getElementById('radarMap').getContext('2d');
    let chart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: ['Synthesis', 'Focus', 'Logic', 'Creativity', 'Initiation', 'Memory', 'Sensory', 'Social'],
            datasets: [{
                data: [9, 8, 7, 6, 4, 5, 5, 4],
                backgroundColor: 'rgba(102, 7, 8, 0.1)',
                borderColor: '#660708',
                borderWidth: 1.5,
                pointBackgroundColor: '#9a8c73'
            }]
        },
        options: { scales: { r: { min: 0, max: 10, ticks: { display: false } } }, plugins: { legend: false } }
    });

    let tasks = [];
    let coreTemp = 32;

    function updateSystems() {
        // 1. Calculate Load
        const committed = tasks.reduce((s, t) => s + parseInt(t.energy), 0);
        const noise = parseInt(document.getElementById('noise').value);
        const fatigue = parseInt(document.getElementById('fatigue').value);
        
        // 2. Thermal Throttling Logic
        coreTemp = 32 + (committed * 0.5) + (noise * 2) + (fatigue * 3);
        
        const mon = document.getElementById('sysMon');
        mon.innerHTML = `
            CORE_TEMP: ${coreTemp.toFixed(1)}°C ${coreTemp > 85 ? '(THROTTLING)' : '(STABLE)'}<br>
            LOAD: ${committed} Spoons Committed<br>
            ENV_NOISE_OFFSET: +${noise * 10}ms
        `;

        // 3. Archetype Engine
        const d = chart.data.datasets[0].data;
        const badge = document.getElementById('archBadge');
        if (d[0] > 7 && d[1] > 7) badge.innerText = "Archetype: THE ALCHEMIST (Deep Synthesis)";
        else if (d[0] > 7 && d[4] < 4) badge.innerText = "Archetype: THE NON-LINEAR ARCHITECT";
        else badge.innerText = "Archetype: THE ACADEMIC SCOUT";

        // 4. UI Throttling
        if (coreTemp > 90) document.getElementById('bodyRoot').classList.add('throttled');
        else document.getElementById('bodyRoot').classList.remove('throttled');
    }

    function addTask() {
        const name = document.getElementById('tName').value;
        const energy = document.getElementById('tEnergy').value;
        if(!name) return;
        tasks.push({ id: Date.now(), name, energy, snoozes: 0 });
        document.getElementById('tName').value = "";
        renderLedger();
        updateSystems();
    }

    function toggleFirewall(id) {
        document.body.classList.toggle('firewall-active');
        const task = tasks.find(t => t.id === id);
        renderLedger();
    }

    function renderLedger() {
        const container = document.getElementById('ledgerItems');
        container.innerHTML = "";
        tasks.forEach(t => {
            const div = document.createElement('div');
            div.className = "task-item";
            div.innerHTML = `
                <div style="flex:1;">
                    <b style="font-size:1.1rem; font-family:'Playfair Display'">${t.name}</b> (${t.energy} Spoons)
                </div>
                <div>
                    <button class="btn btn-gold" style="margin-right:5px;" onclick="toggleFirewall(${t.id})">FOCUS FIREWALL</button>
                    <button class="btn" style="background:var(--slate);" onclick="tasks = tasks.filter(x => x.id !== ${t.id}); renderLedger(); updateSystems();">DONE</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function exportSettings() {
        const sensory = chart.data.datasets[0].data[6];
        const config = { "editor.minimap.enabled": sensory < 5, "workbench.colorTheme": "Dark Academia Hardened" };
        const blob = new Blob([JSON.stringify(config, null, 2)], {type : 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'hardened_settings.json'; a.click();
    }

    document.querySelectorAll('input').forEach(i => i.oninput = updateSystems);
    updateSystems();
</script>
</body>
    
</html>
