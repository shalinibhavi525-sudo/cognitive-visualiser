<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAF | Cognitive Architecture Framework</title>
   
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --parchment: #fdfcf0; 
            --ink: #1a1a1a;       
            --gold: #b8860b;      
            --border: #d1cfb7;    
            --text-secondary: #555;
        }

        body {
            background-color: var(--parchment);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 60px 0 30px 0;
            text-align: center;
            border-bottom: 1px double var(--border);
            margin-bottom: 50px;
        }

        h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.5rem;
            margin: 0; 
            font-weight: 700; 
            letter-spacing: -1px;
            font-style: italic;
        }

        .tagline { 
            font-family: 'Playfair Display', serif;
            color: var(--text-secondary); 
            font-size: 1.1rem; 
            margin-top: 5px; 
            font-style: italic;
        }

        .app-container {
            max-width: 1000px;
            width: 90%;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 50px;
            margin-bottom: 100px;
        }

        .panel {
            padding: 10px;
        }

        .control-section { margin-bottom: 40px; }
        .control-section h3 { 
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem; 
            color: var(--gold); 
            margin-bottom: 20px; 
            border-bottom: 1px solid var(--border);
        }

        .slider-wrap { margin-bottom: 20px; }
        .slider-wrap label { display: block; font-size: 0.85rem; margin-bottom: 8px; color: var(--ink); font-weight: 600; }
        
        input[type=range] { 
            width: 100%; 
            accent-color: var(--gold); 
            cursor: pointer; 
            background: transparent;
        }

        /* The Manifesto / Output */
        .manifesto-box {
            border: 1px solid var(--border);
            padding: 40px;
            background: white;
            box-shadow: 10px 10px 0px var(--border);
        }

        .manifesto-box h2 { 
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem; 
            border-bottom: 2px solid var(--gold);
            display: inline-block;
            margin-bottom: 20px;
        }

        #supportText {
            line-height: 1.8;
            font-size: 0.95rem;
            color: #333;
        }

        .btn-print {
            background: var(--ink);
            color: var(--parchment);
            border: none;
            padding: 12px 25px;
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            transition: 0.3s;
        }

        .btn-print:hover {
            background: var(--gold);
        }

        canvas {
            filter: grayscale(0.2) contrast(1.1);
        }

        @media (max-width: 850px) {
            .app-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <h1>The Cognitive Architecture Framework</h1>
    <div class="tagline">Formalizing the "Spiky Profile" for Professional Self-Advocacy</div>
</header>

<div class="app-container">
 
    <div class="panel">
        <div class="control-section">
            <h3>Intellectual Peaks</h3>
            <div class="slider-wrap">
                <label>Systematic Synthesis</label>
                <input type="range" min="1" max="10" value="9" id="p1">
            </div>
            <div class="slider-wrap">
                <label>Hyperfocus Threshold</label>
                <input type="range" min="1" max="10" value="8" id="p2">
            </div>
            <div class="slider-wrap">
                <label>Pattern Induction</label>
                <input type="range" min="1" max="10" value="7" id="p3">
            </div>
        </div>

        <div class="control-section">
            <h3>Friction Valleys</h3>
            <div class="slider-wrap">
                <label>Executive Initiation</label>
                <input type="range" min="1" max="10" value="3" id="v1">
            </div>
            <div class="slider-wrap">
                <label>Sensory Integration</label>
                <input type="range" min="1" max="10" value="4" id="v2">
            </div>
            <div class="slider-wrap">
                <label>Context Switching</label>
                <input type="range" min="1" max="10" value="3" id="v3">
            </div>
        </div>
        
        <button class="btn-print" onclick="window.print()">PUBLISH MANIFESTO</button>
    </div>

   
    <div class="panel">
        <div style="height: 450px; margin-bottom: 50px;">
            <canvas id="mainChart"></canvas>
        </div>

        <div class="manifesto-box" id="manifestoOutput">
            <h2>Cognitive Protocol</h2>
            <div id="supportText">Loading architectural diagnostics...</div>
        </div>
    </div>
</div>

<script>
    const ctx = document.getElementById('mainChart').getContext('2d');

    const labels = ['Synthesis', 'Focus', 'Patterning', 'Initiation', 'Sensory', 'Switching'];
    const initialData = [9, 8, 7, 3, 4, 3];

    let chart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: labels,
            datasets: [{
                data: initialData,
                backgroundColor: 'rgba(184, 134, 11, 0.15)', 
                borderColor: '#1a1a1a', 
                pointBackgroundColor: '#b8860b',
                pointBorderColor: '#fdfcf0',
                borderWidth: 1.5,
                pointRadius: 4
            }]
        },
        options: {
            scales: {
                r: {
                    min: 0, max: 10,
                    grid: { color: '#d1cfb7' },
                    angleLines: { color: '#d1cfb7' },
                    pointLabels: { 
                        color: '#1a1a1a', 
                        font: { family: "'Playfair Display', serif", size: 14, style: 'italic' } 
                    },
                    ticks: { display: false }
                }
            },
            plugins: { legend: { display: false } }
        }
    });

    function generateManifesto() {
        const vals = chart.data.datasets[0].data;
        const text = document.getElementById('supportText');
        
        let support = "<b>Architectural Observations & Environment Needs:</b><br><br>";

        if(vals[0] > 7) support += "• <b>Synthesis Peak:</b> Individual thrives in high-complexity environments where disparate data sets must be integrated. Direct, non-linear problems are preferred.<br>";
        
        if(vals[3] < 5) {
            support += "• <b>Initiation Valley:</b> High activation energy required for task starting. Suggesting 'Body Doubling' or clearly defined 15-minute 'Micro-Tasks' to bypass executive friction.<br>";
        }
        
        if(vals[5] < 5) {
            support += "• <b>Switching Constraint:</b> Deep focus is fragile. Context switching carries a high cognitive tax. Recommend dedicated 4-hour 'Deep Work' blocks with zero interjections.<br>";
        }

        if(vals[4] < 5) {
            support += "• <b>Sensory Load:</b> Environment must be strictly regulated (Low-light, noise-controlled) to preserve bandwidth for intellectual output.<br>";
        }

        text.innerHTML = support + "<br><i>This document serves as a formal interface between neurodivergent architecture and institutional expectations.</i>";
    }

    
    const inputs = ['p1', 'p2', 'p3', 'v1', 'v2', 'v3'];
    inputs.forEach((id, index) => {
        document.getElementById(id).addEventListener('input', (e) => {
            chart.data.datasets[0].data[index] = e.target.value;
            chart.update();
            generateManifesto();
        });
    });

    generateManifesto();
</script>

</body>
</html>
